services:
  - type: web
    name: qr-generator-fastapi
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Cloudflare Turnstile secret key — set via Render dashboard (sync: false).
      # Si se omite, usa la test key de Cloudflare (siempre pasa = no protege).
      - key: TURNSTILE_SECRET_KEY
        sync: false
